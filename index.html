<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한끼큐브 — 월급은 큐브로, 밥값은 미래까지</title>
<meta name="description" content="월급과 취향으로 이번 달 쓸 수 있는 돈을 10×10 큐브로 보여주고, 물가·임금 데이터로 미래의 한 끼를 비교하는 개인 맞춤형 생활비 플래너">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 방문 통계: Cloudflare Web Analytics 스크립트를 발급받으면 </body> 바로 위에 붙여 넣으세요 -->
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F6;--card:#FFFFFF;--ink:#191F28;--sub:#4E5968;--muted:#8B95A1;--line:#E5E8EB;--soft:#F7F8FA;
  --mint:#0FA37F;--mint-hi:#21C795;--mint-wash:#E5F7F0;--mint-ink:#077A5E;
  --coral:#E8603C;--blue:#5B7BE0;--red:#E5484D;--red-wash:#FDECEC;
  --r:20px;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9ECEF;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--mint);outline-offset:2px;border-radius:8px}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.shell.ob{padding-bottom:0;background:var(--card)}
/* 헤더 */
.top{position:sticky;top:0;z-index:20;background:rgba(242,244,246,.92);backdrop-filter:blur(12px)}
.top-in{padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.topnav{display:none;flex:1;gap:4px}
.topnav button{border:0;background:none;padding:9px 16px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.topnav button:hover{background:var(--soft);color:var(--ink)}
.topnav button.on{background:var(--mint-wash);color:var(--mint-ink)}
.page-head{display:none}
.layout>.col{min-width:0}
.hide-m{display:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.03em}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--mint);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px}
.logo i b{background:#fff;border-radius:2px;opacity:.95}
.logo i b:nth-child(4){opacity:.35}
.top .mo{font-size:13px;color:var(--muted);font-weight:500}
main{padding:4px 16px 24px}
.card{background:var(--card);border-radius:var(--r);padding:22px 20px;margin-bottom:12px}
.card.tight{padding:18px 18px}
.kicker{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 4px}
.big{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.2;margin:0}
.big small{font-size:16px;font-weight:600;margin-left:2px}
.h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.desc{font-size:13.5px;color:var(--sub);margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap}
.pill.mint{background:var(--mint-wash);color:var(--mint-ink)}
.pill.red{background:var(--red-wash);color:var(--red)}
/* 버튼 */
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--mint);color:#fff;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#0C9673}
.btn:disabled{background:#C9D1D8;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--sub)}
.btn.ghost:hover{background:#ECEFF2}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.btn.line{background:#fff;color:var(--mint-ink);box-shadow:inset 0 0 0 1.5px var(--mint)}
.btn.danger{background:var(--red-wash);color:var(--red)}
.link{background:none;border:0;padding:4px 2px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--soft);color:var(--sub);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:600;box-shadow:inset 0 0 0 1.5px transparent;transition:background .12s,box-shadow .12s}
.chip:hover{background:#ECEFF2}
.chip.on{background:var(--mint-wash);color:var(--mint-ink);box-shadow:inset 0 0 0 1.5px var(--mint)}
.chip.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.opt{display:block;width:100%;text-align:left;border:0;background:var(--soft);border-radius:16px;padding:17px 18px;font-size:16px;font-weight:600;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px transparent;position:relative}
.opt:hover{background:#ECEFF2}
.opt.on{background:var(--mint-wash);color:var(--mint-ink);box-shadow:inset 0 0 0 1.5px var(--mint)}
.opt.on::after{content:"✓";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:800}
.opt small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
/* 입력 */
.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:7px}
.inp{width:100%;border:0;background:var(--soft);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;box-shadow:inset 0 0 0 1.5px transparent}
.inp:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--mint);background:#fff}
.money{position:relative}
.money .inp{padding-right:40px;text-align:right}
.money::after{content:"원";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8B95A1 50%),linear-gradient(135deg,#8B95A1 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.fx{display:grid;grid-template-columns:1fr 130px 34px;gap:8px;align-items:center;margin-bottom:8px}
.fx .inp{padding:12px 13px;font-size:15px}
.fx .money .inp{padding-right:30px}
.fx .money::after{right:12px}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:34px;height:34px;border-radius:10px}
.x:hover{background:var(--soft);color:var(--red)}
.sum{display:flex;justify-content:space-between;padding:14px 16px;background:var(--mint-wash);border-radius:14px;color:var(--mint-ink);font-weight:700;margin-top:14px}
.sum.warn{background:var(--red-wash);color:var(--red)}
/* 온보딩 */
.ob-wrap{min-height:100vh;display:flex;flex-direction:column;padding:18px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.ob-top{display:flex;align-items:center;gap:12px;height:40px}
.back{border:0;background:none;font-size:22px;width:36px;height:36px;border-radius:10px;color:var(--sub)}
.back:hover{background:var(--soft)}
.prog{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}
.ob-body{flex:1;padding-top:26px}
.ob-q{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin:0 0 8px}
.ob-sub{font-size:14.5px;color:var(--sub);margin:0 0 24px}
.ob-foot{padding-top:16px}
.hero-ob{padding-top:40px}
.hero-ob .cube-demo{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:250px;margin:0 0 28px}
.hero-ob .cube-demo i{aspect-ratio:1;border-radius:5px;background:var(--mint)}
.hero-ob .cube-demo i.e{background:#FFEDE6;box-shadow:inset 0 0 0 1.5px #F3B29C}
.hero-ob .cube-demo i.f{background:repeating-linear-gradient(135deg,#DDE2E7 0 3px,#EEF1F4 3px 6px)}
/* 큐브 */
.cube-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:18px}
.cell{aspect-ratio:1;border-radius:6px;background:#EEF1F4;position:relative;overflow:hidden}
.cell.full{background:linear-gradient(160deg,var(--mint-hi),var(--mint))}
.cell.spent,.cell.part{background:#FFEDE6;box-shadow:inset 0 0 0 1.5px #F3B29C}
.cell.spent::after{content:"";position:absolute;left:50%;top:50%;width:34%;height:2px;background:#EE8B6C;border-radius:2px;transform:translate(-50%,-50%);opacity:.8}
.cell.part::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--p);background:linear-gradient(160deg,var(--mint-hi),var(--mint));border-radius:2px 2px 0 0}
.cell.fixed{background:repeating-linear-gradient(135deg,#D9DEE3 0 3px,#EEF1F4 3px 6px)}
.cell.over{background:#FFD9D9;box-shadow:inset 0 0 0 1.5px #F09999}
.cell.just::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--mint-hi),var(--mint));border-radius:inherit;animation:vanish .9s ease-in forwards;z-index:1}
.cell.just{animation:pop .9s ease-out}
@keyframes vanish{0%{opacity:1;transform:scale(1)}60%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(.2)}}
@keyframes pop{0%,55%{transform:scale(1)}75%{transform:scale(1.12)}100%{transform:scale(1)}}
.cube-box{position:relative;margin-top:18px;background:var(--soft);border-radius:16px;padding:12px}
.cube-box .cube-grid{margin-top:0}
.burst{position:absolute;right:14px;top:-14px;background:var(--coral);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:99px;box-shadow:0 6px 16px rgba(232,96,60,.35);animation:burst 2.2s ease-out forwards;pointer-events:none;z-index:3}
@keyframes burst{0%{opacity:0;transform:translateY(10px) scale(.8)}12%{opacity:1;transform:translateY(0) scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.usebar{height:10px;border-radius:99px;background:var(--mint);overflow:hidden;margin-top:16px;display:flex}
.usebar i{display:block;height:100%;background:#F3A086;transition:width .6s}
.usebar b{display:block;height:100%;background:repeating-linear-gradient(135deg,#C9D1D8 0 3px,#E5E8EB 3px 6px)}
.usecap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:7px}
.usecap em{font-style:normal;font-weight:700;color:var(--coral)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat3 div{background:var(--soft);border-radius:14px;padding:12px}
.stat3 b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.stat3 span{font-size:12px;color:var(--muted)}
/* 지출 */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.cats::-webkit-scrollbar{display:none}
.exp{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--soft)}
.exp .t{flex:1;min-width:0}
.exp .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .t span{font-size:12.5px;color:var(--muted)}
.exp .a{text-align:right;font-weight:700;font-size:15px}
.exp .a span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
/* 탭바 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11.5px;font-weight:600;color:#B0B8C1;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{color:var(--mint)}
/* 세그먼트 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E5E8EB;border-radius:13px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 0;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* 추천 */
.rec{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0;padding-bottom:4px}
.rec .rk{width:26px;font-weight:800;color:var(--mint);font-size:17px;text-align:center;flex:none}
.rec .t{flex:1;min-width:0}
.rec .t b{font-size:16px;font-weight:700;display:block}
.rec .t .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rec .p{text-align:right;flex:none}
.rec .p b{display:block;font-weight:700}
.rec .p span{display:block;font-size:12px;color:var(--muted)}
.rec .p .btn{display:block;margin-left:auto}
.note{background:var(--soft);border-radius:14px;padding:13px 15px;font-size:13px;color:var(--sub);line-height:1.6}
.note.mint{background:var(--mint-wash);color:var(--mint-ink)}
.note.red{background:var(--red-wash);color:var(--red)}
/* 비교 */
.era{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.era div{border-radius:16px;padding:14px 12px;background:var(--soft);text-align:center}
.era div.now{background:var(--mint-wash)}
.era div.fut{background:#FDF0EB}
.era span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.era b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0 0}
.era em{font-style:normal;font-size:12px;color:var(--sub)}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{font-weight:700;font-size:15px}
.tbl td span{display:block;font-size:11.5px;color:var(--muted)}
.tbl td.dn b{color:var(--coral)}
.chart-wrap{position:relative;margin-top:14px;touch-action:pan-y}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;top:0;pointer-events:none;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(25,31,40,.14);padding:10px 12px;font-size:12.5px;min-width:150px;opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block;font-size:13px;margin-bottom:4px}
.tip div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip i{width:10px;height:3px;border-radius:2px;display:inline-block;margin-right:4px}
.leg2{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--sub);margin-top:10px}
.leg2 span{display:inline-flex;align-items:center;gap:6px}
.leg2 i{width:14px;height:3px;border-radius:2px;display:inline-block}
.leg2 .dash{background:repeating-linear-gradient(90deg,#8B95A1 0 4px,transparent 4px 7px)}
.takeaway{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.5;margin:14px 0 0}
.takeaway em{font-style:normal;color:var(--coral)}
.takeaway strong{color:var(--mint-ink)}
/* 설정 */
.list-btn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:15px 2px;font-size:15.5px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.list-btn:last-child{border-bottom:0}
.list-btn span{color:#B0B8C1;font-size:18px}
.list-btn.red{color:var(--red)}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.src{font-size:12.5px;color:var(--sub);line-height:1.75;margin:0;padding-left:16px}
footer{padding:4px 22px 20px;font-size:12px;color:var(--muted);line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:rgba(25,31,40,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:960px){
  body{background:var(--bg)}
  .shell{max-width:none;background:var(--bg);padding-bottom:0}
  .top{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:14px 32px}
  .topnav{display:flex}
  .tabbar{display:none}
  main{max-width:1180px;margin:0 auto;padding:30px 32px 24px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 22px}
  .page-head h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.25}
  .page-head p{margin:6px 0 0;color:var(--sub);font-size:15px}
  .layout{display:grid;gap:20px;align-items:start}
  .layout.home{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .layout.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:1/-1}
  .hide-m{display:block}
  .seg.mobile-only{display:none}
  .card{padding:28px;margin-bottom:20px;border-radius:24px}
  .card.tight{padding:22px 28px}
  .big{font-size:42px}
  .cube-box{padding:18px;border-radius:20px}
  .cube-grid{gap:8px}
  .cell{border-radius:9px}
  .stat3 div{padding:14px 16px}
  .stat3 b{font-size:17px}
  .note{margin-bottom:20px}
  footer{max-width:1180px;margin:0 auto;padding:0 32px 36px}
  .toast{bottom:36px}
  /* 온보딩: 가운데 카드 */
  .shell.ob{background:var(--bg);padding:48px 24px}
  .ob-shell{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(25,31,40,.08)}
  .ob-side{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#E7F8F1,#D3F2E6);padding:44px}
  .ob-wrap{min-height:640px;padding:36px 44px}
  .hero-ob .cube-demo{display:none}
}
@media (max-width:959px){.ob-side{display:none}}
.ob-side .logo{font-size:20px}
.ob-side h2{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin:28px 0 12px}
.ob-side p{color:var(--sub);font-size:15px;margin:0;line-height:1.7}
.ob-side .cube-demo{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:340px;margin-top:36px}
.ob-side .cube-demo i{aspect-ratio:1;border-radius:6px;background:var(--mint)}

function menuPrice(item,reg,year){const m=D.menu[item];if(m[reg]&&m[reg][year])return m[reg][year];
  const ks=Object.keys(m);return mean(ks.map(k=>m[k][year]));}
function baseYear(item){return item==="김밥"?2017:2016;} /* 김밥 2016년은 조사 기준 변경으로 제외 */
function itemGrowth(item,reg){const b=baseYear(item);return Math.pow(menuPrice(item,reg,2026)/menuPrice(item,reg,b),1/(2026-b))-1;}
function priceAt(item,reg,year){if(year===2016||year===2017||year===2025||year===2026)return menuPrice(item,reg,year);
  return menuPrice(item,reg,2026)*Math.pow(1+itemGrowth(item,reg),year-2026);}
function foodGrowth(reg){return mean(MENU_KEYS.map(i=>itemGrowth(i,reg)));}
function wageRow(reg){return D.wage[reg]||D.wage["전국"];}
function wageGrowth(reg){const w=wageRow(reg),ys=D.wageYears;let a=-1,b=-1;
  for(let i=0;i<ys.length;i++){if(w[i]&&ys[i]<=2025){if(a<0)a=i;b=i;}}
  return Math.pow(w[b]/w[a],1/(ys[b]-ys[a]))-1;}
function minWageGrowth(){return Math.pow(D.minWage["2027"]/D.minWage["2017"],1/10)-1;}
function cpiGrowth(){const c=D.cpi;return Math.pow(c.idx[7]/c.idx[0],1/7)-1;} /* 2018→2025 실제치 */
function minWageAt(y){if(D.minWage[String(y)])return D.minWage[String(y)];return D.minWage["2027"]*Math.pow(1+minWageGrowth(),y-2027);}

function monthExp(){const m=monthKey();return S.expenses.filter(e=>e.month===m);}

function foodPrice(it){return it.k?menuPrice(it.k,region(),2026):it.p;}
function recFood(){
  const a=S.food||{},rem=remaining(),max=FOOD_BUD[a.budget]??Infinity;
  const place=a.place==="학식·구내식당"?"학식":(a.place||"외식");
  const kinds=a.kind||[],tastes=(a.taste||[]).filter(x=>x!=="상관없음").map(x=>x.slice(0,2));
  const avoid=(a.avoid||[]).filter(x=>x!=="없음");
  const form={"든든한 식사":"든든","가벼운 식사":"가벼움"}[a.form]||"간편식";
  const share=a.with==="친구와 함께"||a.with==="가족과 함께";
  const base=FOODS.map(it=>Object.assign({},it,{price:foodPrice(it)})).filter(it=>it.pl.includes(place)&&!it.ing.some(g=>avoid.includes(g)));
  const score=it=>{let s=0;const why=[];
    if(!kinds.length||kinds.includes("상관없음"))s+=1;else if(kinds.includes(it.t)){s+=3;why.push(it.t);}
    const tm=it.ta.filter(x=>tastes.includes(x));if(tm.length){s+=2;why.push(tm[0]);}
    if(it.f===form){s+=1;why.push(form==="든든"?"든든함":form==="가벼움"?"가볍게":"간편식");}
    if(share&&it.share){s+=1;why.push("함께 먹기 좋음");}
    if(isFinite(max)&&it.price>=max*.6)s+=.5;
    return {s,why};};
  let ok=base.filter(it=>it.price<=max&&it.price<=rem),relaxed=false;
  if(!ok.length&&rem>0){ok=base.filter(it=>it.price<=rem);relaxed=ok.length>0;}
  return {list:ok.map(it=>Object.assign(it,score(it))).sort((x,y)=>y.s-x.s||x.price-y.price).slice(0,5),relaxed,place,max};}
function recLeisure(){
  const a=S.leisure||{},rem=remaining(),max=LEI_BUD[a.budget]??Infinity;
  const kinds=(a.kind||[]).map(k=>LEI_KIND[k]),mood=LEI_MOOD[a.mood],stu=S.setup.type==="student";
  const score=it=>{let s=0;const why=[];
    if(kinds.includes(it.t)){s+=3;why.push(it.t);}
    if(it.who.includes(a.who)){s+=2;why.push(a.who==="혼자"?"혼자서도 좋음":a.who+"와 함께");}
    if(it.m===mood){s+=2;why.push(a.mood.replace(" 분위기",""));}
    if(a.time==="시간 날 때마다"||it.tm.includes(a.time))s+=1;
    if(a.io==="둘 다 상관없음"||it.io===a.io){s+=1;}
    if(stu&&it.stu)why.push("학생 할인");
    return {s,why};};
  let ok=LEISURE.filter(it=>it.c<=max&&it.c<=Math.max(0,rem)),relaxed=false;
  if(!ok.length){ok=LEISURE.filter(it=>it.c===0);relaxed=true;}
  return {list:ok.map(it=>Object.assign({},it,score(it))).sort((x,y)=>y.s-x.s||x.c-y.c).slice(0,5),relaxed};}

function chartSeries(){
  const reg=region(),N=CMP.yrs,FY=THIS_YEAR+N,stu=S.setup.type==="student";
  /* 밥값 지수: 8개 메뉴 가격비 평균 (2016은 김밥 제외) */
  const fIdx=y=>{const ks=y===2016?MENU_KEYS.filter(k=>k!=="김밥"):MENU_KEYS;return mean(ks.map(k=>priceAt(k,reg,y)/menuPrice(k,reg,2026)))*100;};
  const food=[2016,2017,2025,2026].map(y=>({y,v:fIdx(y),p:false}));
  for(let y=2027;y<=FY;y++)food.push({y,v:fIdx(y),p:true});
  let inc=[];
  if(stu){const b=D.minWage["2026"];for(let y=2016;y<=FY;y++)inc.push({y,v:minWageAt(y)/b*100,p:y>2027});}
  else{const w=wageRow(reg),ys=D.wageYears,b=w[ys.indexOf(2026)],g=wageGrowth(reg);
    ys.forEach((y,i)=>{if(w[i])inc.push({y,v:w[i]/b*100,p:false});});
    for(let y=2027;y<=FY;y++)inc.push({y,v:100*Math.pow(1+g,y-2026),p:true});}
  const c=D.cpi,cb=c.idx[c.years.indexOf(2026)],cg=cpiGrowth(),cpi=[];
  c.years.forEach((y,i)=>cpi.push({y,v:c.idx[i]/cb*100,p:y>=2026}));
  for(let y=2028;y<=FY;y++)cpi.push({y,v:c.idx[c.years.length-1]/cb*100*Math.pow(1+cg,y-2027),p:true});
  return [{id:"food",name:"외식 메뉴 가격",color:"#E8603C",pts:food,gap:true},
          {id:"inc",name:stu?"최저시급":"내 지역 월급",color:"#0FA37F",pts:inc},
          {id:"cpi",name:"전체 물가",color:"#5B7BE0",pts:cpi}];}
function drawChart(){
  const svg=$("chart");if(!svg)return;
  const SER=chartSeries(),N=CMP.yrs,FY=THIS_YEAR+N;
  const wide=svg.parentNode.clientWidth>520,W=wide?560:360,H=wide?330:230,L=34,R=8,T=12,B=26,x0=2016,x1=FY;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const all=SER.flatMap(s=>s.pts.map(p=>p.v));
  let lo=Math.floor(Math.min(...all)/10)*10,hi=Math.ceil(Math.max(...all)/10)*10;
  const X=y=>L+(y-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g="";
  const step=(hi-lo)>80?20:10;
  for(let v=lo;v<=hi;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===100?"#C9D1D8":"#EEF1F4"}" stroke-width="1"/>`+
    `<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#8B95A1">${v}</text>`;}
  const ticks=[2016,2020,2026,FY].filter((v,i,a)=>a.indexOf(v)===i);
  ticks.forEach(y=>{g+=`<text x="${X(y)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8B95A1">${y}</text>`;});
  g+=`<rect x="${X(2026)}" y="${T}" width="${W-R-X(2026)}" height="${H-T-B}" fill="#F7F8FA"/>`;
  g+=`<text x="${X(2026)+5}" y="${T+11}" font-size="9.5" fill="#8B95A1">추정</text>`;
  SER.forEach(s=>{const p=s.pts;
    for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],gap=b.y-a.y>1,dash=a.p||b.p||gap;
      g+=`<line x1="${X(a.y)}" y1="${Y(a.v)}" x2="${X(b.y)}" y2="${Y(b.v)}" stroke="${s.color}" stroke-width="${gap?1.5:2}" stroke-linecap="round" ${dash?`stroke-dasharray="${gap?"1.5 4":"5 4"}"`:""} ${gap?'opacity=".7"':""}/>`;}
    if(s.gap)p.filter(q=>!q.p).forEach(q=>{g+=`<circle cx="${X(q.y)}" cy="${Y(q.v)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;});});
  g+=`<line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#191F28" stroke-width="1" opacity="0"/><g id="hdots"></g>`;
  g+=`<rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  svg.innerHTML=g;
  $("leg2").innerHTML=SER.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")+`<span><i class="dash"></i>추정</span>`;
  /* 결론 문장 */
  const last=id=>{const s=SER.find(q=>q.id===id);return s.pts[s.pts.length-1].v;};
  const f=last("food"),w=last("inc"),c=last("cpi"),stu=S.setup.type==="student";
  $("chartTake").innerHTML=`${N}년 뒤 밥값은 <em>${pct(f/100-1)}</em>, ${stu?"최저시급":"월급"}은 <strong>${pct(w/100-1)}</strong>, 전체 물가는 ${pct(c/100-1)}로 추정돼요.`+
    (f>w?`<br>${stu?"시급":"월급"}보다 밥값이 더 빨리 올라요.`:`<br>${stu?"시급":"월급"}이 밥값보다 빨리 올라요.`);
  /* 표 */
  if(TBL){const years=[...new Set(SER.flatMap(s=>s.pts.map(p=>p.y)))].sort((a,b)=>a-b);
    $("chartTbl").innerHTML=`<table class="tbl"><thead><tr><th>연도</th>${SER.map(s=>`<th>${s.name}</th>`).join("")}</tr></thead><tbody>`+
      years.map(y=>`<tr><td>${y}${y>2026?" (추정)":""}</td>${SER.map(s=>{const p=s.pts.find(q=>q.y===y);return `<td>${p?p.v.toFixed(1):"-"}</td>`;}).join("")}</tr>`).join("")+`</tbody></table>`;}
  /* 호버 */
  const hit=$("hit"),tip=$("tip"),cross=$("cross"),hd=$("hdots"),wrap=$("chartWrap");
  const move=ev=>{const r=svg.getBoundingClientRect(),sx=(ev.clientX-r.left)/r.width*W;
    let y=Math.round(x0+(sx-L)/(W-L-R)*(x1-x0));y=Math.max(x0,Math.min(x1,y));
    cross.setAttribute("x1",X(y));cross.setAttribute("x2",X(y));cross.setAttribute("opacity",".25");
    let dots="",rows="";
    SER.forEach(s=>{const p=s.pts.find(q=>q.y===y);if(!p)return;
      dots+=`<circle cx="${X(y)}" cy="${Y(p.v)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
      rows+=`<div><span><i style="background:${s.color}"></i>${s.name}</span><b style="margin:0">${p.v.toFixed(1)}</b></div>`;});
    hd.innerHTML=dots;
    tip.innerHTML=`<b>${y}년${y>2026?" · 추정":y===2026?" · 잠정":""}</b>`+(rows||`<div class="muted">이 해는 조사값이 없어요</div>`);
    tip.style.opacity=1;const px=X(y)/W*r.width;
    tip.style.left=Math.min(Math.max(0,px-80),r.width-170)+"px";tip.style.top="-6px";tip.style.transform="translateY(-100%)";};
  const out=()=>{tip.style.opacity=0;cross.setAttribute("opacity","0");hd.innerHTML="";};
  hit.addEventListener("pointermove",move);hit.addEventListener("pointerdown",move);hit.addEventListener("pointerleave",out);}

const ICONS={
 home:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2" opacity=".35"/></svg>',
 rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="currentColor" stroke="none"/></svg>',
 cmp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
 set:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>'};
function render(){
  const app=$("app"),shell=$("shell");
  if(!S.setup&&!OB)OB={step:0,editOnly:false,d:{type:"",region:"서울특별시",income:0,car:false,solo:true,fixed:[]},food:{}};
  if(OB){shell.classList.add("ob");app.innerHTML=viewOB();if(OB.step===2)fixedSumLive();return;}
  shell.classList.remove("ob");
  let main="";
  if(TAB==="home")main=viewHome();else if(TAB==="rec")main=viewRec();else if(TAB==="cmp")main=viewCompare();else main=viewSettings();
  const TABS=[["home","내 큐브"],["rec","추천"],["cmp","미래 비교"],["set","설정"]];
  const go=t=>`TAB='${t}';LQ=${TAB==="rec"&&t==="rec"?"LQ":"null"};PREV_R=null;render();window.scrollTo(0,0)`;
  app.innerHTML=`<header class="top"><div class="top-in"><div class="logo"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i>한끼큐브</div>
    <nav class="topnav" aria-label="메뉴">${TABS.map(t=>`<button class="${TAB===t[0]?"on":""}" onclick="${go(t[0])}">${t[1]}</button>`).join("")}</nav>
    <span class="mo">${NOW.getFullYear()}년 ${NOW.getMonth()+1}월</span></div></header>
  <main>${main}</main>
  <footer>한끼큐브는 수업 과제로 만든 개인 맞춤형 생활비 플래너예요. 이 페이지는 서비스 개선을 위해 방문 통계를 수집할 수 있어요(쿠키 미사용).</footer>
  <nav class="tabbar" aria-label="메뉴">${TABS.map(t=>
    `<button class="${TAB===t[0]?"on":""}" onclick="${go(t[0])}" ${TAB===t[0]?'aria-current="page"':""}>${ICONS[t[0]]}${t[1]}</button>`).join("")}</nav>`;
  if(TAB==="cmp")drawChart();}
let RZ;window.addEventListener("resize",()=>{clearTimeout(RZ);RZ=setTimeout(()=>{if(TAB==="cmp"&&!OB)drawChart();},150);});
render();
</script>
</body>
</html>
